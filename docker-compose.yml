services:
  bowser:
    build: .
    ports:
      - "${APP_PORT:-7504}:7504"
    environment:
      ROOT_DIR: /files
      THUMBS_DIR: /thumbs
      DB_PATH: /data/app.db
      RCLONE_BIN: rclone
      MAX_RCLONE_SERVES: ${MAX_RCLONE_SERVES:-20}
    volumes:
      # the directory of files to serve - point ROOT_HOST_DIR at whatever you want,
      # e.g. `ROOT_HOST_DIR=/mnt/nas/files docker compose up`
      - ${ROOT_HOST_DIR:-./files}:/files
      # thumbnail cache and sqlite db (users/sessions/settings) - kept outside the container so
      # they survive rebuilds; fine to leave at the repo-relative defaults
      - ${THUMBS_HOST_DIR:-./.thumbs}:/thumbs
      - ${DATA_HOST_DIR:-./data}:/data
    restart: unless-stopped
    # protocol-based share links (webdav/sftp/ftp/http, see src/lib/rcloneServe.ts) are each
    # served by `rclone serve` on a port the app allocates at random from the OS's ephemeral
    # range - those ports aren't known ahead of time, so they can't be individually published
    # here. if you use that feature, either switch to `network_mode: host` (Linux only, and
    # remove the `ports:` block above since it's then a no-op) or publish a fixed range you've
    # also pointed the app at, which the app doesn't currently support out of the box.
